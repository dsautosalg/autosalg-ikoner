<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skadebilder</title>

<!-- Ikoner -->
<link rel="apple-touch-icon" sizes="180x180" href="https://dsautosalg.github.io/autosalg-ikoner/karosseri-icon-180.png">
<link rel="apple-touch-icon-precomposed" href="https://dsautosalg.github.io/autosalg-ikoner/karosseri-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://dsautosalg.github.io/autosalg-ikoner/karosseri-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://dsautosalg.github.io/autosalg-ikoner/karosseri-icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://dsautosalg.github.io/autosalg-ikoner/karosseri-favicon-32.png">

<!-- PWA & Hjemskjerm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skadebilder">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D23A31">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0c0c0d;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  #splash {
    position: fixed;
    inset: 0;
    background: #0c0c0d;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.35s ease;
  }
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
  #splash img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    animation: splashIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes splashIn {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="splash">
    <img id="splashLogo" src="https://dsautosalg.github.io/autosalg-ikoner/karosseri-icon-512.png" alt="">
  </div>

  <!-- allow-attributtet er kritisk - uten det blokkeres kamera/skjermlås
       siden dette er en cross-origin iframe (github.io -> script.google.com) -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbw5e1Jr-fmlr9sYxX4IAK0xi2TAg24xF7MhzzLqQdmMV5EdAg4ZA9R5xQXXtxbKRbeH/exec"
    allow="camera; microphone; screen-wake-lock">
  </iframe>

  <script>
    var splash = document.getElementById('splash');
    var frame = document.getElementById('appFrame');
    var logo = document.getElementById('splashLogo');
    var hidden = false;
    var imageReady = false;
    var frameReady = false;
    var minTimeElapsed = false;

    function hideSplash() {
      if (hidden) return;
      hidden = true;
      splash.classList.add('hide');
    }

    function maybeHide() {
      if (imageReady && frameReady && minTimeElapsed) hideSplash();
    }

    // Bildet kan være ferdig lastet (fra cache) allerede før denne lytteren
    // rekker å bli lagt til - sjekk .complete direkte i tillegg til load/error.
    if (logo.complete && logo.naturalWidth > 0) {
      imageReady = true;
    } else {
      logo.addEventListener('load', function () { imageReady = true; maybeHide(); });
      logo.addEventListener('error', function () { imageReady = true; maybeHide(); }); // ikke heng fast hvis bildet skulle feile
    }

    frame.addEventListener('load', function () { frameReady = true; maybeHide(); });

    // Minimum visningstid, så logoen garantert rekker å vises et øyeblikk
    // selv om alt annet laster lynraskt.
    setTimeout(function () { minTimeElapsed = true; maybeHide(); }, 600);

    // Sikkerhetsnett: skjul splashen uansett etter 3 sekunder.
    setTimeout(hideSplash, 3000);
  </script>
</body>
</html>
