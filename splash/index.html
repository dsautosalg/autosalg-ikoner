<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Autosalg</title>

<!-- Ikoner -->
<link rel="apple-touch-icon" sizes="180x180" href="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-icon-180.png">
<link rel="apple-touch-icon-precomposed" href="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-favicon-32.png">

<!-- PWA & Hjemskjerm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autosalg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D23A31">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0c0c0d;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  #splash {
    position: fixed;
    inset: 0;
    background: #0c0c0d;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    animation: splashFadeOut 0.35s ease forwards;
    animation-delay: 1.1s;
  }
  @keyframes splashFadeOut {
    from { opacity: 1; }
    to   { opacity: 0; pointer-events: none; }
  }
  #splash img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    animation: splashIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes splashIn {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="splash">
    <img id="splashLogo" src="https://dsautosalg.github.io/autosalg-ikoner/splash/splash-icon-512.png" alt="">
  </div>

  <!-- Ingen kamera-tilgang trengs her (menysiden bare lenker videre til de
       tre app-ene, som hver håndterer sin egen kamera-tilgang), men iframen
       beholdes for samme visuelle stil (splash-fade) som de andre appene. -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxJS6SVVcBNPut5ajAgienFw7VU702AOoLxhXkb3EAYJFHeTmfP1K7PCkj2NxH-OvRt9w/exec">
  </iframe>

  <script>
    // Menysiden (Apps Script) kjører i en sandkasse-iframe som ikke
    // nødvendigvis får lov til å bytte hele fanens URL selv. Når noen
    // velger en app der, sender den en postMessage opp hit i stedet - vi
    // (den ekte toppsiden i fanen) gjør selve navigeringen.
    //
    // Vi navigerer IKKE direkte til app-ens ekte exec-URL lenger (det
    // knakk fullskjerm-/hjemskjerm-visningen, siden den hoppet til et
    // helt annet opphav - script.google.com - og det gjorde URL-en synlig
    // og bokmerkbar for alltid). I stedet lagrer vi den midlertidig i
    // sessionStorage (kun i denne fanen, aldri skrevet til noen fil) og
    // sender brukeren videre til app/-siden på SAMME opphav som denne
    // siden. Den siden har ingen URL bakt inn i seg i det hele tatt - den
    // henter kun det som eventuelt ligger og venter i sessionStorage, og
    // fjerner det med det samme. Se kommentaren i app/index.html.
    window.addEventListener('message', function(ev){
      if (!ev.data || ev.data.type !== 'autosalg-nav' || typeof ev.data.url !== 'string') return;
      if (ev.origin.indexOf('google') === -1) return;
      try {
        sessionStorage.setItem('autosalg_pending_url', ev.data.url);
        sessionStorage.setItem('autosalg_pending_key', ev.data.key || '');
      } catch (e) { /* privat modus e.l. - naviger uansett, bare uten ikon/tittel-tilpasning */ }
      window.location.href = 'https://dsautosalg.github.io/autosalg-ikoner/app/';
    });
  </script>

</body>
</html>
